# Сайт Foksten на lerti (201.34.159.41, Timeweb Новосибирск, РФ).
# Ставит деплой/выкатить.sh --nginx. Трогает только свои имена.
#
# Почему не GitHub Pages: зарубежный хостинг для посетителей из РФ ТСПУ
# обрывает на ~16 КБ — страница открывается белым экраном (так было с
# RateSpot 07.10). Сайт для РФ живёт на российской коробке.
#
# Основной адрес — foksten.ru (куплен 10.10.2026, Рег.ру). www и прежний
# a3.201-34-159-41.nip.io — 301 на него. Один сертификат Let's Encrypt
# на три имени: certbot --cert-name foksten.ru (см. README → «Домен»).

server {
    listen 80;
    server_name foksten.ru www.foksten.ru a3.201-34-159-41.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://foksten.ru$request_uri; }
}

# www и старый адрес — на основной; пути сохраняются
server {
    listen 443 ssl http2;
    server_name www.foksten.ru a3.201-34-159-41.nip.io;
    ssl_certificate     /etc/letsencrypt/live/foksten.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foksten.ru/privkey.pem;
    return 301 https://foksten.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name foksten.ru;
    ssl_certificate     /etc/letsencrypt/live/foksten.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foksten.ru/privkey.pem;

    # current — ссылка на выпуск в releases/: выкатка подменяет её одним шагом
    root /var/www/a3/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Подтверждение прав в Яндекс Вебмастере (аккаунт владельца, 10.10.2026).
    # Живёт в конфиге, а не в выпуске: выкатка подменяет каталог целиком.
    location = /yandex_ca2c11e644a3b246.html {
        default_type text/html;
        return 200 '<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"></head><body>Verification: ca2c11e644a3b246</body></html>';
    }

    # Стенд: все варианты дизайна с переключателем — для владельца.
    # Открыт по прямой ссылке, в поиск не попадает.
    location ^~ /stend/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    # Витрина игр (репозиторий «с нуля до ляма$ на играх/игры/витрина»): свой каталог
    # со своими выпусками — выкатка сайта агентства её не трогает. ^~ — регулярные
    # location ниже сюда не заходят, кэш задаём внутри.
    location ^~ /games/ {
        alias /var/www/games/current/;
        index index.html;
        location ~* \.(css|js|svg|woff2|png|jpg|webp|mp4)$ {
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options nosniff always;
        }
        location ~* \.html$ {
            expires -1;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
    }
    location = /games { return 301 /games/; }

    # Хеша в именах файлов нет: html не кэшируем, статику держим неделю.
    location ~* \.(css|js|svg|woff2|png|jpg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.html$ {
        expires -1;   # сам ставит Cache-Control: no-cache
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
    gzip_min_length 512;

    access_log /var/log/nginx/a3.access.log;
    error_log  /var/log/nginx/a3.error.log;
}
