# Сайт а3 на lerti (201.34.159.41, Timeweb Новосибирск, РФ) — с 10.10.2026.
# Ставит деплой/выкатить.sh --nginx. Трогает только свои имена.
#
# Почему не GitHub Pages: зарубежный хостинг для посетителей из РФ ТСПУ
# обрывает на ~16 КБ — страница открывается белым экраном (так было с
# RateSpot 07.10). Сайт для РФ живёт на российской коробке.
#
# Домена под а3 пока нет — адрес на nip.io. Когда купят: добавить имя в
# server_name, выпустить сертификат на оба имени, SITE_ORIGIN поменять в
# site.config.json и выкатить заново (canonical и sitemap собираются с ним).

server {
    listen 80;
    server_name a3.201-34-159-41.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name a3.201-34-159-41.nip.io;
    ssl_certificate     /etc/letsencrypt/live/a3.201-34-159-41.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a3.201-34-159-41.nip.io/privkey.pem;

    # current — ссылка на выпуск в releases/: выкатка подменяет её одним шагом
    root /var/www/a3/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Стенд: все варианты дизайна с переключателем — для владельца.
    # Открыт по прямой ссылке, в поиск не попадает.
    location ^~ /stend/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    # Хеша в именах файлов нет: html не кэшируем, статику держим неделю.
    location ~* \.(css|js|svg|woff2|png|jpg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~* \.html$ {
        expires -1;   # сам ставит Cache-Control: no-cache
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
    gzip_min_length 512;

    access_log /var/log/nginx/a3.access.log;
    error_log  /var/log/nginx/a3.error.log;
}
