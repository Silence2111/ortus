# GitHub Pages для Foksten — переадресация на прод, а не копия сайта.
#
# Сайт живёт на российской коробке (деплой/выкатить.sh): зарубежный хостинг —
# а Pages зарубежный — ТСПУ для посетителей из РФ обрывает на ~16 КБ, страница
# открывается белым экраном. Раньше здесь полгода висела первая версия сайта
# с canonical на ortus.ru, домен чужой компании. Теперь на каждую старую
# страницу — заглушка с canonical и переходом на ту же страницу прода
# (адрес — site.config.json → origin).

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Тесты витрины
        run: npm test
      - name: Заглушки-переадресации на прод
        run: node деплой/pages-переадресация.mjs pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
